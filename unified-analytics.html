<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Unified Fleet Analytics Dashboard - Industry & Role Views" />
    <title>Fleet Analytics Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: auto;
      }
      
      #root {
        width: 100%;
        min-height: 100%;
      }
      
      body {
        background: #e8f0f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      * {
        -webkit-overflow-scrolling: touch;
      }
      
      /* Loading state */
      .loading-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 400px;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Post message to parent when ready
      window.addEventListener('load', function() {
        if (window.parent !== window) {
          window.parent.postMessage({
            type: 'unified-analytics-ready',
            source: 'navixy-analytics'
          }, '*');
        }
      });
      
      // Auto height reporting
      if (window.ResizeObserver) {
        window.addEventListener('load', function() {
          const observer = new ResizeObserver(function() {
            if (window.parent !== window) {
              window.parent.postMessage({
                type: 'unified-analytics-resize',
                source: 'navixy-analytics',
                height: document.body.scrollHeight
              }, '*');
            }
          });
          observer.observe(document.body);
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="loading-container">
        <div style="text-align: center;">
          <div class="spinner"></div>
          <p style="margin-top: 16px; color: #6366f1; font-size: 14px;">Loading Analytics...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
