<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Management Dashboard Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        /* Dashboard container takes full viewport */
        .dashboard-iframe-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #f9fafb;
        }
        
        .dashboard-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Loading state */
        .iframe-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #6366f1;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .iframe-loading.hidden {
            display: none;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e5e7eb;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Embedded Dashboard - Full Screen -->
    <div class="dashboard-iframe-container">
        <div id="iframe-loading" class="iframe-loading">
            <div class="spinner"></div>
            <p style="font-size: 18px; font-weight: 600;">Loading Dashboard...</p>
        </div>
        <iframe 
            id="dashboard-iframe"
            src="embed.html" 
            class="dashboard-iframe"
            title="Fleet Management Dashboard"
            allow="fullscreen"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
        </iframe>
    </div>
    
    <script>
        // Handle iframe loading and communication
        (function() {
            const iframe = document.getElementById('dashboard-iframe');
            const loading = document.getElementById('iframe-loading');
            
            // Hide loading indicator when iframe loads
            iframe.addEventListener('load', function() {
                setTimeout(function() {
                    loading.classList.add('hidden');
                }, 500);
            });
            
            // Listen for messages from the embedded dashboard
            window.addEventListener('message', function(event) {
                // Verify message source
                if (event.data.source === 'navixy-dashboard') {
                    if (event.data.type === 'dashboard-ready') {
                        console.log('Dashboard is ready!');
                        loading.classList.add('hidden');
                    } else if (event.data.type === 'dashboard-resize') {
                        // Optionally adjust iframe height based on content
                        console.log('Dashboard size:', event.data.width, 'x', event.data.height);
                    }
                }
            });
            
            // Send initial configuration to dashboard if needed
            iframe.addEventListener('load', function() {
                iframe.contentWindow.postMessage({
                    type: 'dashboard-config',
                    theme: 'light',
                    embedded: true
                }, '*');
            });
        })();
    </script>
</body>
</html>
