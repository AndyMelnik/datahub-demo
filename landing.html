<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Analytics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .dashboard-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #e8f0f7;
        }
        
        .dashboard-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #6366f1;
        }
        
        .loading.hidden {
            display: none;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e5e7eb;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="font-size: 16px; font-weight: 600;">Loading Analytics Dashboard...</p>
        </div>
        <iframe 
            id="dashboard"
            src="unified-analytics.html" 
            class="dashboard-iframe"
            title="Fleet Analytics Dashboard"
            allow="fullscreen"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
        </iframe>
    </div>
    
    <script>
        (function() {
            const iframe = document.getElementById('dashboard');
            const loading = document.getElementById('loading');
            
            iframe.addEventListener('load', function() {
                setTimeout(function() {
                    loading.classList.add('hidden');
                }, 300);
            });
            
            window.addEventListener('message', function(event) {
                if (event.data.source === 'navixy-analytics') {
                    if (event.data.type === 'unified-analytics-ready') {
                        loading.classList.add('hidden');
                    }
                }
            });
        })();
    </script>
</body>
</html>
